<header
  class="navbar is-scrolled"
  [class.is-open]="isMenuOpen()"
>
  <div class="navbar__inner container">

    <!-- LOGO UMJESTO LINKA POČETNA -->
    <a
      [routerLink]="lang.path('home')"
      class="navbar__logo"
      aria-label="Avalena početna stranica"
      (click)="closeMenu()"
    >
      <img
        [src]="
          '/avalena-logo-transparent.svg'
        "
        alt="Avalena Residence"
        class="navbar__logo-img"
      />
    </a>

    <!-- NAVIGACIJA -->
    <nav
      class="navbar__links"
      [class.is-open]="isMenuOpen()"
    >
      @for (unit of units; track unit.id) {
        <a
          [routerLink]="lang.path('unit', unit.id)"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >
          {{ unit.name }}
        </a>
      }
    </nav>

    <!-- JEZIK -->
    <div class="navbar__actions">
      <div class="navbar__lang">
        <a
          [href]="lang.alternateUrl('hr')"
          hreflang="hr"
          lang="hr"
          aria-label="Hrvatski"
          (click)="switchLang($event, 'hr')"
        >
          <span [class.is-active]="lang.current() === 'hr'">HR</span>
        </a>

        <span class="navbar__lang-sep">
          |
        </span>

        <a
          [href]="lang.alternateUrl('en')"
          hreflang="en"
          lang="en"
          aria-label="English"
          (click)="switchLang($event, 'en')"
        >
          <span [class.is-active]="lang.current() === 'en'">EN</span>
        </a>
      </div>
    </div>

    <!-- MOBILNI MENI -->
    <button
      class="navbar__burger"
      type="button"
      [class.is-open]="isMenuOpen()"
      (click)="toggleMenu()"
      aria-label="Otvori ili zatvori izbornik"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>
